<svg width="480" height="120" viewBox="0 0 480 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1329" />
      <stop offset="100%" stop-color="#070D1E" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <style>
    .card-bg { fill: url(#cardBg); stroke: #1E293B; stroke-width: 1.5; }
    .shield-body { fill: url(#shieldGrad); stroke: url(#cyanGrad); stroke-width: 3.5; stroke-linejoin: round; }
    .wing-path { fill: none; stroke: url(#goldGrad); stroke-width: 3.2; stroke-linecap: round; }
    .star-elem { fill: url(#goldGrad); }
    .book-elem { fill: #FFFFFF; opacity: 0.95; }
    .title-siap { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 38px; font-weight: 900; fill: #FFFFFF; }
    .title-asn { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 38px; font-weight: 900; fill: #FBBF24; }
    .dot-elem { fill: #38BDF8; }
    .sub-tagline { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #38BDF8; letter-spacing: 2px; }
  </style>

  <!-- Background Rounded Card Banner for crisp contrast on Dark & Light GitHub themes -->
  <rect x="2" y="2" width="476" height="116" rx="20" class="card-bg" fill="#0B1329" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Logo Emblem Group (Left: x=24, y=16) -->
  <g transform="translate(26, 16) scale(0.88)">
    <!-- Outer Shield Hexagon -->
    <path
      d="M50 6 L88 24 L88 64 C88 80 50 94 50 94 C50 94 12 80 12 64 L12 24 Z"
      class="shield-body"
      fill="#1E40AF"
      stroke="#38BDF8"
      stroke-width="3.5"
      stroke-linejoin="round"
    />

    <!-- Stylized Wings (Garuda dynamic arcs) -->
    <!-- Left Wing -->
    <path
      d="M50 36 C38 28 26 32 20 44 C26 44 34 42 42 47 C30 48 24 56 22 66 C28 62 38 60 46 64"
      class="wing-path"
      fill="none"
      stroke="#FBBF24"
      stroke-width="3.2"
      stroke-linecap="round"
    />

    <!-- Right Wing -->
    <path
      d="M50 36 C62 28 74 32 80 44 C74 44 66 42 58 47 C70 48 76 56 78 66 C72 62 62 60 54 64"
      class="wing-path"
      fill="none"
      stroke="#FBBF24"
      stroke-width="3.2"
      stroke-linecap="round"
    />

    <!-- Central Star -->
    <polygon
      points="50,22 53,29 60,30 55,35 56,42 50,38 44,42 45,35 40,30 47,29"
      class="star-elem"
      fill="#FBBF24"
    />

    <!-- Knowledge Book Base -->
    <path
      d="M36 72 Q50 67 50 78 Q50 67 64 72 L62 76 Q50 71 50 82 Q50 71 38 76 Z"
      class="book-elem"
      fill="#FFFFFF"
    />
  </g>

  <!-- Typography Brand Header (Right of emblem) -->
  <g transform="translate(132, 0)">
    <!-- SIAP ASN . -->
    <text x="0" y="65">
      <tspan class="title-siap" fill="#FFFFFF">SIAP</tspan>
      <tspan class="title-asn" fill="#FBBF24" dx="2">ASN</tspan>
    </text>

    <!-- Blue Dot -->
    <circle cx="205" cy="56" r="5" class="dot-elem" fill="#38BDF8"/>

    <!-- Subtitle: SIMULASI CAT & AKADEMI ASN -->
    <text x="2" y="89" class="sub-tagline" fill="#38BDF8">
      SIMULASI CAT &amp; AKADEMI ASN
    </text>
  </g>
</svg>
